{% extends 'templates/htmlbase/base.html' %}

{% block head %}
<style type="text/css">
.material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
</style>
{% endblock %}

{% block content %}
<main class="flex flex-1 items-center justify-center py-5">
    <div class="layout-content-container flex w-full max-w-md flex-col items-center">
        <div class="flex w-full flex-col items-center gap-6 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-8 shadow-lg">
            <div class="flex w-full flex-col gap-3 text-center">
                <p class="text-leapp-black dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Forgot Your Password?</p>
                <p class="text-gray-600 dark:text-gray-300 text-base font-normal leading-normal">Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            <div class="w-full">
                <label class="flex flex-col">
                    <p class="text-leapp-black dark:text-white text-base font-medium leading-normal pb-2">Email Address</p>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-14 p-[15px] text-base font-normal leading-normal text-leapp-black dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-400 focus:border-leapp-yellow focus:outline-0 focus:ring-2 focus:ring-leapp-yellow/50"
                        placeholder="Enter your email" value="" />
                </label>
            </div>
            <div class="w-full">
                <button
                    class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 bg-leapp-yellow text-leapp-black text-base font-bold leading-normal tracking-[0.015em] transition-all hover:bg-leapp-yellow/90">
                    <span class="truncate">Send Reset Link</span>
                </button>
            </div>
            <div class="w-full">
                <a href="/login"
                    class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 bg-gray-100 dark:bg-gray-700 text-leapp-black dark:text-white text-base font-bold leading-normal tracking-[0.015em] transition-all hover:bg-gray-200 dark:hover:bg-gray-600">
                    <span class="truncate">Back to Login</span>
            </a>
            </div>
        </div>
    </div>
</main>

{% endblock %}
