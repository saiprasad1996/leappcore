{% set ga_measurement_id = frappe.db.get_single_value("Website Settings", "google_analytics_id") or "G-6L1F4JCK2G" %}
{% if ga_measurement_id %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_measurement_id | e }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga_measurement_id | e }}');
</script>
{% endif %}
